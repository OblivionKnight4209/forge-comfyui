name: test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Seed + forge unit tests
        run: npx --yes tsx --test src/lib/forge/seed.test.ts src/lib/forge/forge.test.ts
