name: release
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pack and tag
        run: |
          set -euo pipefail
          VER=$(tr -d '[:space:]' < VERSION)
          echo "version=$VER" >> "$GITHUB_ENV"
          rm -f Forge-offline.zip
          zip -r Forge-offline.zip . -x '.git/*' '.github/*' 'node_modules/*' '*.zip'
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -f "v$VER"
          git push origin "v$VER" --force
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ env.version }}"
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" Forge-offline.zip \
            --title "Forge $TAG" \
            --notes "Forge $TAG — unzip and run start-forge.sh" \
            --latest \
            --target "$GITHUB_SHA"
