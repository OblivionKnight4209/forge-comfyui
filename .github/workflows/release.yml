name: release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - VERSION
      - start-forge.sh
      - src/components/forge/studio.tsx
      - src/lib/forge/store.ts
      - .github/workflows/release.yml
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests before zip
        run: npx --yes tsx --test src/lib/forge/seed.test.ts
      - name: Pack
        run: |
          VER=$(tr -d '[:space:]' < VERSION || echo 261)
          echo "version=$VER" >> "$GITHUB_ENV"
          sed -i "s/tabular-nums text-subtle\">[0-9][0-9]*/tabular-nums text-subtle\">${VER}/" src/components/forge/studio.tsx || true
          sed -i "s/Forge v[0-9][0-9]*/Forge v${VER}/" start-forge.sh || true
          rm -f Forge-offline.zip "Forge-v${VER}.zip"
          zip -r Forge-offline.zip . -x '.git/*' '.github/*' 'node_modules/*' '*.zip'
          cp Forge-offline.zip "Forge-v${VER}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ env.version }}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" Forge-offline.zip "Forge-v${{ env.version }}.zip" \
            --title "Forge $TAG" \
            --notes "Forge $TAG. Files: Forge-offline.zip and Forge-v${{ env.version }}.zip" \
            --latest
